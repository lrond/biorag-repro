{
  "name": "bioasq12b_report_strict",
  "question_path": "BioASQ-training12b.zip",
  "protocol": "report_holdout",
  "sample_size": 500,
  "sample_seed": 42,
  "corpus_mode": "linked_pubmed",
  "cache_dir": "data/interim/pubmed_cache",
  "canonical_questions_path": "data/processed/questions.jsonl",
  "sampled_questions_path": "data/interim/sampled_question_ids.json",
  "training": {
    "path": "BioASQ-training12b.zip",
    "member_names": ["BioASQ-training12b/training12b_new.json"],
    "member_glob": "*.json"
  },
  "golden": {
    "path": "Task12BGoldenEnriched.zip",
    "member_names": [],
    "member_glob": "Task12BGoldenEnriched/*_golden.json"
  },
  "linked_pubmed": {
    "base_url": "https://eutils.ncbi.nlm.nih.gov/entrez/eutils",
    "tool": "biorag-repro",
    "email_env": "NCBI_EMAIL",
    "batch_size": 50,
    "sleep_seconds": 0.34
  },
  "pubmed_dump": {
    "input_path": "data/raw/pubmed_dump.jsonl",
    "id_field": "pmid",
    "title_field": "title",
    "abstract_field": "abstract"
  }
}
