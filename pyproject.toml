[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biorag-repro"
version = "0.1.0"
description = "Reproducible BioRAG scaffold for BioASQ biomedical QA experiments."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Bowen" }
]
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
cloud = [
  "bert-score>=0.3.13",
  "faiss-cpu>=1.8.0",
  "hydra-core>=1.3.2",
  "numpy>=1.26.0",
  "sentence-transformers>=3.0.1",
  "torch>=2.3.0",
  "transformers>=4.41.0",
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.4.0",
]

[project.scripts]
biorag = "biorag.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
